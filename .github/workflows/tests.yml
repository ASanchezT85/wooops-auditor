name: tests

# Manual trigger only. This repository is private and has no GitHub Actions
# minutes available, so an automatic push trigger produces nothing but a failed
# run on every commit. The real gate is the local pre-push hook in bin/hooks;
# see docs/TESTING.md. Restore the push/pull_request triggers here the day the
# repo goes public or Actions billing is enabled — the job itself is correct.
on:
  workflow_dispatch:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer install --no-interaction --no-progress

      - run: vendor/bin/phpunit

      # The sample report is committed; it must stay reproducible from fixtures.
      - name: Sample report is up to date
        run: |
          php bin/generate-sample.php
          git diff --exit-code examples/
