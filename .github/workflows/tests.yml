name: tests

# Manual trigger only, for now. The GitHub account this repository belongs to
# is locked for billing ("The job was not started because your account is
# locked due to a billing issue"), so no runner will pick this up on push, and
# an automatic trigger would just stamp a red X on every commit of a public
# repo. The job itself is correct and has been verified to reach the runner.
#
# The working gate meanwhile is the local pre-push hook: see docs/TESTING.md.
# Restore the push/pull_request triggers once billing is sorted.
on:
  workflow_dispatch:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer install --no-interaction --no-progress

      - run: vendor/bin/phpunit

      # The sample report is committed; it must stay reproducible from fixtures.
      - name: Sample report is up to date
        run: |
          php bin/generate-sample.php
          git diff --exit-code examples/
