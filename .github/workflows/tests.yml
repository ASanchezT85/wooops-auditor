name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer install --no-interaction --no-progress

      - run: vendor/bin/phpunit

      # The sample report is committed; it must stay reproducible from fixtures.
      - name: Sample report is up to date
        run: |
          php bin/generate-sample.php
          git diff --exit-code examples/
